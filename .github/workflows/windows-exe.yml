name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marocto-racing-pc-latest
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build portable Windows EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:build

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = 'dist/Marocto-Racing-Windows-x64.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected EXE was not created: $exe"
          }
          $size = (Get-Item $exe).Length
          if ($size -lt 1000000) {
            throw "EXE is unexpectedly small: $size bytes"
          }
          Write-Host "Built $exe ($size bytes)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marocto-Racing-Windows-x64
          path: dist/Marocto-Racing-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable PC Latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = 'dist/Marocto-Racing-Windows-x64.exe'
          $notes = "Automatic Windows x64 build from main. Commit: $env:GITHUB_SHA"
          gh release view pc-latest --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload pc-latest $asset --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit pc-latest --title 'Marocto Racing - PC Latest' --notes $notes --latest --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create pc-latest $asset --target $env:GITHUB_SHA --title 'Marocto Racing - PC Latest' --notes $notes --latest --repo $env:GITHUB_REPOSITORY
          }
