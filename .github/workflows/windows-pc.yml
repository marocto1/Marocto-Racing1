name: Build Windows PC

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  windows-pc:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout v1.4 source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check all web and desktop modules
        run: npm run check

      - name: Run v1.4 physics regression tests
        run: npm test

      - name: Build Windows portable EXE
        run: npm run pc:build

      - name: Verify portable EXE
        shell: pwsh
        run: |
          $exe = Get-Item "dist/Marocto-Racing-PC-1.4.0-x64.exe"
          if ($exe.Length -lt 50000000) { throw "EXE is unexpectedly small: $($exe.Length) bytes" }
          Write-Host "Verified $($exe.Name) - $([math]::Round($exe.Length / 1MB, 1)) MB"

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marocto-Racing-PC-v1.4.0
          path: dist/Marocto-Racing-PC-1.4.0-x64.exe
          retention-days: 30

      - name: Publish stable PC Latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-latest
          name: Marocto Racing PC v1.4.0 - Player vs AI
          body: |
            Restored full Marocto Racing v1.4.0 PC base.
            Full-screen single-player race against a physics-driven AI opponent.
            Choose the AI car and ROOKIE / RIVAL / PRO / ELITE difficulty in the garage.
          files: dist/Marocto-Racing-PC-1.4.0-x64.exe
          overwrite_files: true
          make_latest: true
