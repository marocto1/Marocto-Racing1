name: Build MW2005 Models Phase 5

on:
  workflow_dispatch:
  push:
    branches: [mw2005-models-phase5-materials]

permissions:
  contents: write

jobs:
  capture-toolkit-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Phase 5 branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile C++23 capture bridge
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic \
            tools/nfsmw-nx-capture/nfsmw_marocto_capture.cpp \
            tools/nfsmw-nx-capture/selftest.cpp \
            -o /tmp/marocto-mw-capture-selftest

      - name: Generate Phase 5 raw draw stream from C++ bridge
        run: |
          mkdir -p /tmp/marocto-phase5
          /tmp/marocto-mw-capture-selftest /tmp/marocto-phase5
          test -s /tmp/marocto-phase5/marocto_capture/raw-draws.json
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/marocto-phase5/marocto_capture/raw-draws.json'));const d=r.draws[0];if(!d.uvs||d.uvs.length!==6||!d.normals||d.normals.length!==9||d.materialKey!=='0x123456789abcdef0')process.exit(2);"

      - name: Feed C++ output through Phase 5 assembler
        run: |
          node scripts/mw-draw-capture-build.mjs \
            /tmp/marocto-phase5/marocto_capture/raw-draws.json \
            /tmp/marocto-phase5/capture.json
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('/tmp/marocto-phase5/capture.json'));if(c.format!=='marocto-mw-native-capture'||c.metadata.uvDraws!==1||c.metadata.normalDraws!==1||!c.body[0].uvs||!c.body[0].normals)process.exit(2);"

  windows-mw2005-models-phase5:
    needs: capture-toolkit-check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Phase 5 branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check game modules and capture tools
        run: |
          npm run check
          node --check scripts/mw-draw-capture-lib.mjs
          node --check scripts/mw-draw-capture-build.mjs

      - name: Exercise Phase 5 PowerShell patch installer
        shell: pwsh
        run: |
          $mock = Join-Path $env:RUNNER_TEMP "nfsmw-nx-mock"
          New-Item -ItemType Directory -Force (Join-Path $mock "app/src") | Out-Null
          @'
          set(NFSMW_SOURCES
              src/nfsmw_nativo_dibujos.cpp
          )
          '@ | Set-Content (Join-Path $mock "app/CMakeLists.txt") -Encoding UTF8
          @'
          #include "nfsmw_nativo_dibujos.h"
          void FakeDraw() {
              // Diagnostic: one line per combination of VS, PS and render target (at most 32).
          }
          '@ | Set-Content (Join-Path $mock "app/src/nfsmw_nativo_dibujos.cpp") -Encoding UTF8
          & ./tools/nfsmw-nx-capture/apply_to_nfsmw_nx.ps1 -NfsmwNxRoot $mock
          $cmake = Get-Content (Join-Path $mock "app/CMakeLists.txt") -Raw
          $draws = Get-Content (Join-Path $mock "app/src/nfsmw_nativo_dibujos.cpp") -Raw
          if ($cmake -notmatch 'nfsmw_marocto_capture.cpp') { throw "Capture source was not added to CMake" }
          if ($draws -notmatch 'MAROCTO_MW_CAPTURE_PHASE5') { throw "Phase 5 capture block was not inserted" }
          if ($draws -notmatch 'a.ubicacion == 4') { throw "Texcoord0 capture was not inserted" }
          if ($draws -notmatch 'material_key') { throw "Material key capture was not inserted" }
          if ($draws -notmatch '#include "nfsmw_marocto_capture.h"') { throw "Capture include was not inserted" }

      - name: Run all regression tests
        run: npm test

      - name: Build Windows portable EXE
        run: npm run pc:build

      - name: Prepare Phase 5 EXE and capture kit
        shell: pwsh
        run: |
          $source = "dist/Marocto-Racing-PC-1.4.0-x64.exe"
          $target = "dist/Marocto-Racing-PC-v1.4.0-MW2005-Models-Phase5-x64.exe"
          Copy-Item $source $target -Force
          $exe = Get-Item $target
          if ($exe.Length -lt 50000000) { throw "EXE is unexpectedly small: $($exe.Length) bytes" }
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          Write-Host "Verified $($exe.Name) - $([math]::Round($exe.Length / 1MB, 1)) MB - SHA256 $hash"

          $kit = "dist/MW2005-Capture-Kit-Phase5"
          New-Item -ItemType Directory -Force $kit | Out-Null
          Copy-Item "tools/nfsmw-nx-capture/*" $kit -Recurse -Force
          Copy-Item "scripts/mw-draw-capture-lib.mjs" $kit -Force
          Copy-Item "scripts/mw-draw-capture-build.mjs" $kit -Force
          Copy-Item "scripts/mw-capture-to-obj.mjs" $kit -Force
          Compress-Archive -Path "$kit/*" -DestinationPath "dist/Marocto-Racing-MW2005-Capture-Kit-Phase5.zip" -Force
          if ((Get-Item "dist/Marocto-Racing-MW2005-Capture-Kit-Phase5.zip").Length -lt 5000) { throw "Capture kit ZIP is unexpectedly small" }

      - name: Upload Phase 5 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Marocto-Racing-MW2005-Models-Phase5
          path: |
            dist/Marocto-Racing-PC-v1.4.0-MW2005-Models-Phase5-x64.exe
            dist/Marocto-Racing-MW2005-Capture-Kit-Phase5.zip
          retention-days: 30

      - name: Publish Phase 5 prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-mw2005-models-phase5
          target_commitish: mw2005-models-phase5-materials
          name: Marocto Racing v1.4.0 - MW2005 UV Materials Phase 5
          prerelease: true
          body: |
            Separate experimental PC build. Stable main, physics releases and Models Phases 1-4 remain unchanged.

            Models Phase 5 extends the tested nfsmw-nx capture path with:
            - real vertex normals when the MW declaration exposes them
            - real TEXCOORD0 UV capture from nfsmw-nx location 4
            - float32, float16, SNORM16 and UNORM16 attribute decoding
            - stable material identity from VS/PS plus pixel-sampler fetch state
            - deterministic material fallback colors when texture images are not yet exported
            - automatic body/wheel candidate isolation using source object id, mesh dimensions, triangle count and repeated compact wheel geometry
            - manual --object/--shader fallback filters
            - full C++ -> raw draw stream -> capture.json CI validation

            No proprietary EA assets or texture pixels are included in this release. Actual game geometry/material data appears only after the user runs the capture kit against their own compatible game files.
          files: |
            dist/Marocto-Racing-PC-v1.4.0-MW2005-Models-Phase5-x64.exe
            dist/Marocto-Racing-MW2005-Capture-Kit-Phase5.zip
          overwrite_files: true
