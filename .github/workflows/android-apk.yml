name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Check web syntax and simulation
        run: npm run check && npm test
      - name: Verify two-player race in Chromium
        run: npm run test:browser
      - name: Generate and sync Android project
        run: npm run android:prepare
      - name: Preserve debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: marocto-racing-debug-signing-v1
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Marocto-Racing-v1.3-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marocto-Racing-APK
          path: Marocto-Racing-v1.3-debug.apk
          retention-days: 30
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: racing-verification
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
