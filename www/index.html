<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Marocto Racing 3D</title><style>*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:system-ui}.page{position:fixed;inset:0;display:none}.page.on{display:flex}#menu{align-items:center;justify-content:center;flex-direction:column;gap:clamp(7px,2vh,14px);background:radial-gradient(circle at 50% 25%,#1a2d4a,#05070b 68%);padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}h1{font-size:clamp(30px,9vw,80px);line-height:.95;margin:0;text-align:center}button,select{color:#fff;background:#141b29;border:1px solid #53617a;border-radius:12px;padding:clamp(8px,1.8vh,13px) 16px;font:700 clamp(12px,2.1vw,16px) system-ui;min-height:40px}#menu>button{width:min(70vw,360px)}.overlay{position:fixed;inset:0;background:#070b12;display:none;z-index:20;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.overlay.open{display:flex}.topbar{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;min-height:42px}.topbar h2{margin:0;font-size:clamp(22px,5vh,38px)}.playertabs{display:flex;gap:8px;margin:6px 0;flex:0 0 auto}.playertabs button{flex:1}.playertabs .active{outline:2px solid #fff;background:#202b3d}.carwrap{flex:1;min-height:0;overflow:auto;padding:4px 2px 72px}.cars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(6px,1.4vh,10px)}.cars button{min-width:0;white-space:normal}.sel{outline:2px solid white;background:#202b3d}.actions{position:absolute;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:10px;background:linear-gradient(transparent,#070b12 25%);padding-top:18px}.actions button{flex:1}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}.sub{opacity:.65;text-align:center}#race{display:none;background:#000}#race.on{display:block}#gl{position:absolute;inset:0;width:100%;height:100%}.split{position:absolute;left:0;right:0;top:50%;height:2px;background:#fff8}.hud{position:absolute;left:max(8px,env(safe-area-inset-left));font-size:clamp(10px,2vw,16px);font-weight:900;text-shadow:0 2px 5px #000}.h0{top:max(5px,env(safe-area-inset-top))}.h1{top:calc(50% + 6px)}.ctrl{position:absolute;left:0;right:0;height:50%;pointer-events:none}.c0{top:0}.c1{bottom:0}.b{position:absolute;width:clamp(42px,8vh,62px);height:clamp(42px,8vh,62px);border-radius:50%;display:grid;place-items:center;background:#0b1220aa;border:2px solid #ffffff66;font-size:clamp(18px,4vh,25px);pointer-events:auto;font-style:normal}.l{left:max(10px,env(safe-area-inset-left));bottom:10px}.r{left:calc(max(10px,env(safe-area-inset-left)) + clamp(50px,10vh,74px));bottom:10px}.g{right:max(10px,env(safe-area-inset-right));bottom:10px}.br{right:calc(max(10px,env(safe-area-inset-right)) + clamp(50px,10vh,74px));bottom:10px}.n{right:max(10px,env(safe-area-inset-right));bottom:calc(20px + clamp(42px,8vh,62px));font-size:11px}.quit{position:absolute;right:max(5px,env(safe-area-inset-right));top:calc(50% - 20px);z-index:9;padding:6px 10px;min-height:32px}.finish{display:none;position:absolute;inset:0;background:#03050ad9;z-index:30;place-items:center;text-align:center}.finish.show{display:grid}.finish b{font-size:10vw}@media (max-height:430px) and (orientation:landscape){#menu{gap:6px}h1{font-size:clamp(28px,8vh,48px)}#menu>button{min-height:34px;padding:6px 14px}.sub,small{font-size:11px}.topbar{min-height:34px}.topbar h2{font-size:22px}.playertabs{margin:3px 0}.playertabs button{min-height:32px;padding:5px}.cars{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.cars button{min-height:34px;padding:5px 8px;font-size:12px}.carwrap{padding-bottom:52px}.actions{padding-top:10px}.actions button{min-height:34px;padding:5px}}@media (min-width:900px) and (min-height:600px){.overlay{inset:5%;border:1px solid #39445b;border-radius:22px;max-width:1100px;margin:auto}.cars{grid-template-columns:repeat(3,1fr)}.actions{left:24px;right:24px;bottom:20px}.b{width:68px;height:68px}}</style></head><body><main id=menu class="page on"><h1>MAROCTO RACING</h1><div class=sub>REAL WEBGL2 · SPLIT SCREEN</div><button onclick="openGarage()" id=start>СТАРТ</button><button onclick="openSettings()" id=set>НАСТРОЙКИ</button><button onclick="location.reload()" id=exit>ВЫХОД</button><small>3D v1.2.1</small></main><section id=garage class=overlay><div class=topbar><h2 id=gt>ГАРАЖ</h2><span id=chosen></span></div><div class=playertabs><button id=tab0 onclick="player(0)">P1</button><button id=tab1 onclick="player(1)">P2</button></div><div class=carwrap><div id=carlist class=cars></div></div><div class=actions><button onclick="closeGarage()" id=back1>НАЗАД</button><button onclick="go()" id=racebtn>НАЧАТЬ ГОНКУ</button></div></section><section id=settings class=overlay><div class=topbar><h2 id=st>НАСТРОЙКИ</h2></div><div class=row><span id=lt>ЯЗЫК</span><select id=lang onchange="language(this.value)"><option value=ru>Русский</option><option value=en>English</option><option value=uz>O‘zbek</option></select></div><div class=row><span id=lapt>КРУГИ</span><select id=laps><option>1</option><option selected>3</option><option>5</option></select></div><div class=actions><button onclick="settings.classList.remove('open')" id=back2>НАЗАД</button></div></section><section id=race class=page><canvas id=gl></canvas><div class=split></div><div id=h0 class="hud h0">P1</div><div id=h1 class="hud h1">P2</div><button class=quit onclick="MR.stop()">MENU</button><div class="ctrl c0"><i class="b l" data-p=0 data-k=l>‹</i><i class="b r" data-p=0 data-k=r>›</i><i class="b br" data-p=0 data-k=b>▼</i><i class="b g" data-p=0 data-k=g>▲</i><i class="b n" data-p=0 data-k=n>N₂O</i></div><div class="ctrl c1"><i class="b l" data-p=1 data-k=l>‹</i><i class="b r" data-p=1 data-k=r>›</i><i class="b br" data-p=1 data-k=b>▼</i><i class="b g" data-p=1 data-k=g>▲</i><i class="b n" data-p=1 data-k=n>N₂O</i></div><div id=finish class=finish><div><b id=win></b><br><button onclick="finish.classList.remove('show');go()">REMATCH</button><button onclick="finish.classList.remove('show');MR.stop()">MENU</button></div></div></section><script type=module src=game.js></script><script>let activePlayer=0;const T={ru:['СТАРТ','НАСТРОЙКИ','ВЫХОД','ГАРАЖ','НАЗАД','НАЧАТЬ ГОНКУ','ЯЗЫК','КРУГИ'],en:['START','SETTINGS','EXIT','GARAGE','BACK','START RACE','LANGUAGE','LAPS'],uz:['START','SOZLAMALAR','CHIQISH','GARAJ','ORTGA','POYGANI BOSHLASH','TIL','AYLANALAR']};function language(l){localStorage.lang=l;let t=T[l];start.textContent=t[0];set.textContent=t[1];exit.textContent=t[2];gt.textContent=t[3];back1.textContent=back2.textContent=t[4];racebtn.textContent=t[5];lt.textContent=t[6];lapt.textContent=t[7];lang.value=l}function openGarage(){garage.classList.add('open');player(0)}function closeGarage(){garage.classList.remove('open')}function openSettings(){settings.classList.add('open')}function player(p){activePlayer=p;tab0.classList.toggle('active',p===0);tab1.classList.toggle('active',p===1);renderCars()}function renderCars(){if(!window.MR)return setTimeout(renderCars,50);carlist.innerHTML='';MR.cars.forEach((c,i)=>{let b=document.createElement('button');b.textContent=c[0];if(MR.pick[activePlayer]===i)b.className='sel';b.onclick=()=>{MR.pick[activePlayer]=i;renderCars()};carlist.appendChild(b)});chosen.textContent='P'+(activePlayer+1)+' · '+MR.cars[MR.pick[activePlayer]][0]}function go(){closeGarage();MR.start(laps.value)}language(localStorage.lang||'ru');</script></body></html>
