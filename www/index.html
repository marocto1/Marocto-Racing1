<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080e16"><link rel="icon" href="data:,"><title>Marocto Racing v1.4 PC</title><link rel="stylesheet" href="style.css"></head>
<body>
<main id="menu" class="page on"><div class="eyebrow">TWO PLAYERS · ONE SCREEN</div><h1>MAROCTO<br><em>RACING</em></h1><div class="sub">PC EDITION · v1.4</div><p id="menuhelp" class="sub"></p><button id="fullscreen" class="fullscreen">⛶</button><button id="start" disabled>СТАРТ</button><button id="set">НАСТРОЙКИ</button><button id="exit">ВЫХОД</button><p id="error" hidden></p></main>
<section id="garage" class="overlay"><div class="topbar"><h2 id="gt">ГАРАЖ</h2><span id="chosen"></span></div><div class="playertabs"><button id="tab0">P1</button><button id="tab1">P2</button></div><div class="garagebody"><div id="garage-preview"><canvas id="gl"></canvas><span class="previewlabel">PROCEDURAL 3D</span></div><div class="carwrap"><div id="carlist" class="cars"></div><p id="modelnote" class="sub"></p></div></div><div class="actions"><button id="back1">НАЗАД</button><button id="racebtn">НАЧАТЬ ГОНКУ</button></div></section>
<section id="settings" class="overlay"><div class="topbar"><h2 id="st">НАСТРОЙКИ</h2></div><div class="settingsbody"><div class="row"><label for="lang" id="lt">ЯЗЫК</label><select id="lang"><option value="ru">Русский</option><option value="en">English</option><option value="uz">O‘zbek</option></select></div><div class="row"><label for="laps" id="lapt">КРУГИ</label><select id="laps"><option>1</option><option selected>3</option><option>5</option></select></div><div class="row"><label id="inputlabel" for="inputmode"></label><select id="inputmode"><option value="auto" id="inputauto"></option><option value="keyboard" id="inputkeyboard"></option><option value="touch" id="inputtouch"></option></select></div><div class="row"><label id="splitlabel" for="splitmode"></label><select id="splitmode"><option value="auto" id="splitauto"></option><option value="vertical" id="splitvertical"></option><option value="horizontal" id="splithorizontal"></option></select></div><p id="keyboardhelp"></p></div><div class="actions"><button id="back2">НАЗАД</button></div></section>
<section id="race" class="page"><div class="split"></div><div id="h0" class="hud h0">P1</div><div id="h1" class="hud h1">P2</div><div id="status0" class="status s0"></div><div id="status1" class="status s1"></div><canvas id="minimap" width="150" height="110"></canvas><button id="quit" class="quit">МЕНЮ</button><div id="countdown"></div><div id="keys0" class="keylegend k0"></div><div id="keys1" class="keylegend k1"></div>
<div class="ctrl c0"><button class="b l" data-p="0" data-k="l">‹</button><button class="b r" data-p="0" data-k="r">›</button><button class="b br" data-p="0" data-k="b">▼</button><button class="b g" data-p="0" data-k="g">▲</button><button class="b n" data-p="0" data-k="n">N₂O</button><button class="b d" data-p="0" data-k="d">DRIFT</button><button class="b reset" data-p="0" data-k="reset">↺</button></div>
<div class="ctrl c1"><button class="b l" data-p="1" data-k="l">‹</button><button class="b r" data-p="1" data-k="r">›</button><button class="b br" data-p="1" data-k="b">▼</button><button class="b g" data-p="1" data-k="g">▲</button><button class="b n" data-p="1" data-k="n">N₂O</button><button class="b d" data-p="1" data-k="d">DRIFT</button><button class="b reset" data-p="1" data-k="reset">↺</button></div>
<div id="finish" class="finish"><div><b id="win"></b><div class="resultactions"><button id="rematch">РЕВАНШ</button><button id="finishmenu">МЕНЮ</button></div></div></div><div id="pause" class="finish"><div><b id="pausetitle">ПАУЗА</b><div class="resultactions"><button id="resume">ПРОДОЛЖИТЬ</button><button id="pausemenu">МЕНЮ</button></div></div></div>
</section><script type="module" src="game.js"></script>
</body></html>
