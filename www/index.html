<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Marocto Racing</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:system-ui,Arial}button,select{font:inherit;color:#fff;background:#171c27;border:1px solid #566079;border-radius:12px;padding:12px 18px}.screen{position:fixed;inset:0;display:none}.screen.on{display:flex}.menu{align-items:center;justify-content:center;flex-direction:column;gap:12px;background:radial-gradient(circle at 50% 30%,#172238,#05070b 65%)}h1{font-size:min(11vw,90px);margin:0;letter-spacing:.06em}.tag{opacity:.65;margin-bottom:20px}.menu button{width:min(72vw,360px);font-weight:700}.small{font-size:13px;opacity:.65}.panel{width:min(90vw,620px);padding:20px;border-radius:20px;background:#0d121dcc;border:1px solid #303a50}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:10px 0}.cars{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.car{padding:10px}.car.sel{outline:2px solid #fff}.game{background:#07101b}.view{position:absolute;left:0;width:100%;height:50%;overflow:hidden}.view.p1{top:0;border-bottom:2px solid #fff}.view.p2{bottom:0}.road{position:absolute;inset:0;background:linear-gradient(#17304b 0 35%,#20242a 35% 100%)}.road:after{content:'';position:absolute;left:12%;right:12%;top:35%;bottom:-10%;background:#353b43;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}.lines{position:absolute;left:49%;top:47%;width:2%;height:60%;background:repeating-linear-gradient(#fff 0 18px,transparent 18px 38px);transform:perspective(250px) rotateX(45deg)}.player{position:absolute;left:50%;bottom:18%;width:54px;height:90px;transform:translateX(-50%);border-radius:16px 16px 8px 8px;background:linear-gradient(90deg,#111 0 10%,var(--c) 10% 90%,#111 90%);box-shadow:0 0 20px #000}.player:after{content:'';position:absolute;left:12px;right:12px;top:12px;height:22px;background:#9fd8ff66;border-radius:8px}.hud{position:absolute;top:8px;left:10px;font-weight:800;text-shadow:0 2px 4px #000}.controls{position:absolute;inset:0}.btn{position:absolute;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#111827aa;border:2px solid #ffffff55;font-size:24px;font-weight:900}.left{left:18px;bottom:18px}.right{left:92px;bottom:18px}.gas{right:18px;bottom:18px}.brake{right:92px;bottom:18px}.nitro{right:18px;bottom:92px;font-size:14px}.back{position:absolute;right:10px;top:8px;z-index:20;width:auto;height:auto;border-radius:10px}.count{position:absolute;inset:0;display:grid;place-items:center;font-size:18vw;font-weight:900;text-shadow:0 5px 20px #000;pointer-events:none}.winner{position:absolute;inset:0;background:#05070be8;display:none;place-items:center;z-index:30;text-align:center}.winner.show{display:grid}.winner h2{font-size:8vw;margin:0}</style></head><body><section id="main" class="screen menu on"><h1>MAROCTO RACING</h1><div class="tag" data-t="tag">SPLIT-SCREEN RACING</div><button onclick="show('garage')" data-t="start">START</button><button onclick="show('settings')" data-t="settings">SETTINGS</button><button onclick="exitApp()" data-t="exit">EXIT</button><div class="small">v1.1 Android</div></section><section id="garage" class="screen menu"><div class="panel"><h2 data-t="garage">GARAGE</h2><div class="row"><b>P1</b><span id="p1name"></span></div><div id="p1cars" class="cars"></div><div class="row"><b>P2</b><span id="p2name"></span></div><div id="p2cars" class="cars"></div><div class="row"><button onclick="show('main')" data-t="back">BACK</button><button onclick="startRace()" data-t="race">RACE</button></div></div></section><section id="settings" class="screen menu"><div class="panel"><h2 data-t="settings">SETTINGS</h2><div class="row"><span data-t="language">LANGUAGE</span><select id="lang" onchange="setLang(this.value)"><option value="en">English</option><option value="ru">Русский</option><option value="uz">O‘zbek</option></select></div><div class="row"><span data-t="laps">LAPS</span><select id="laps"><option>1</option><option selected>3</option><option>5</option></select></div><button onclick="show('main')" data-t="back">BACK</button></div></section><section id="game" class="screen game"><button class="back" onclick="show('main')">MENU</button><div id="v1" class="view p1"><div class="road"></div><div class="lines"></div><div id="car1" class="player" style="--c:#2f8cff"></div><div id="hud1" class="hud">P1 · 0 km/h · LAP 1</div><div class="controls"><div class="btn left" data-p="0" data-k="l">‹</div><div class="btn right" data-p="0" data-k="r">›</div><div class="btn brake" data-p="0" data-k="b">▼</div><div class="btn gas" data-p="0" data-k="g">▲</div><div class="btn nitro" data-p="0" data-k="n">N₂O</div></div></div><div id="v2" class="view p2"><div class="road"></div><div class="lines"></div><div id="car2" class="player" style="--c:#ff3e54"></div><div id="hud2" class="hud">P2 · 0 km/h · LAP 1</div><div class="controls"><div class="btn left" data-p="1" data-k="l">‹</div><div class="btn right" data-p="1" data-k="r">›</div><div class="btn brake" data-p="1" data-k="b">▼</div><div class="btn gas" data-p="1" data-k="g">▲</div><div class="btn nitro" data-p="1" data-k="n">N₂O</div></div></div><div id="count" class="count"></div><div id="winner" class="winner"><div><h2 id="wintext"></h2><button onclick="startRace()">REMATCH</button><button onclick="show('main')">MENU</button></div></div></section><script>const cars=[['BMW M3 GTR E46',305,8.6],['Nissan Skyline GT-R R34',295,8.2],['Toyota Supra Mk4',290,8.0],['Mazda RX-7 FD',280,8.8],['Mitsubishi Lancer Evo IX',275,9.0],['Porsche 911 GT3',310,9.2]];let pick=[0,1],keys=[{},{}],race=false,t0=0;const tr={en:{tag:'SPLIT-SCREEN RACING',start:'START',settings:'SETTINGS',exit:'EXIT',garage:'GARAGE',back:'BACK',race:'RACE',language:'LANGUAGE',laps:'LAPS'},ru:{tag:'ГОНКИ НА ДВОИХ',start:'СТАРТ',settings:'НАСТРОЙКИ',exit:'ВЫХОД',garage:'ГАРАЖ',back:'НАЗАД',race:'ГОНКА',language:'ЯЗЫК',laps:'КРУГИ'},uz:{tag:'IKKI KISHILIK POYGA',start:'START',settings:'SOZLAMALAR',exit:'CHIQISH',garage:'GARAJ',back:'ORTGA',race:'POYGA',language:'TIL',laps:'AYLANALAR'}};function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');race=id==='game'&&race}function setLang(l){localStorage.lang=l;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tr[l][e.dataset.t]);document.getElementById('lang').value=l}function garage(){[0,1].forEach(p=>{let box=document.getElementById('p'+(p+1)+'cars');box.innerHTML='';cars.forEach((c,i)=>{let b=document.createElement('button');b.className='car'+(pick[p]===i?' sel':'');b.textContent=c[0];b.onclick=()=>{pick[p]=i;garage()};box.appendChild(b)});document.getElementById('p'+(p+1)+'name').textContent=cars[pick[p]][0]})}function startRace(){show('game');document.getElementById('winner').classList.remove('show');state=[mk(0),mk(1)];let c=3;race=false;let el=document.getElementById('count');el.textContent=c;let it=setInterval(()=>{c--;el.textContent=c>0?c:c===0?'GO!':'';if(c<0){clearInterval(it);el.textContent='';race=true;t0=performance.now()}},700)}function mk(p){return{x:0,s:0,lap:1,n:100,p}}let state=[mk(0),mk(1)];function loop(now){requestAnimationFrame(loop);if(!race)return;let dt=Math.min(.04,(now-(loop.last||now))/1000);loop.last=now;state.forEach((s,p)=>{let k=keys[p],spec=cars[pick[p]],max=spec[1];if(k.n&&s.n>0){max*=1.25;s.n=Math.max(0,s.n-28*dt)}else s.n=Math.min(100,s.n+9*dt);if(k.g)s.s+=spec[2]*8*dt;if(k.b)s.s-=110*dt;s.s-=s.s*0.45*dt;s.s=Math.max(-40,Math.min(max,s.s));if(k.l)s.x-=95*dt*(.4+Math.abs(s.s)/max);if(k.r)s.x+=95*dt*(.4+Math.abs(s.s)/max);s.x=Math.max(-42,Math.min(42,s.x));let car=document.getElementById('car'+(p+1));car.style.left=(50+s.x*.7)+'%';car.style.transform='translateX(-50%) rotate('+(k.l?-8:k.r?8:0)+'deg)';let elapsed=(now-t0)/1000;if(elapsed>s.lap*14){s.lap++;let target=+document.getElementById('laps').value;if(s.lap>target){race=false;document.getElementById('wintext').textContent='P'+(p+1)+' WINS!';document.getElementById('winner').classList.add('show')}}document.getElementById('hud'+(p+1)).textContent='P'+(p+1)+' · '+Math.round(Math.abs(s.s))+' km/h · LAP '+Math.min(s.lap,+document.getElementById('laps').value)+' · N₂O '+Math.round(s.n)+'%'})}requestAnimationFrame(loop);document.querySelectorAll('.btn').forEach(b=>{let p=+b.dataset.p,k=b.dataset.k;let on=e=>{e.preventDefault();keys[p][k]=true};let off=e=>{e.preventDefault();keys[p][k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});function exitApp(){if(window.Capacitor?.Plugins?.App)window.Capacitor.Plugins.App.exitApp();else show('main')}garage();setLang(localStorage.lang||'ru');</script></body></html>
