<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080e16"><link rel="icon" href="data:,"><title>Marocto Racing v1.4.0 PC</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="singleplayer.css"></head>
<body data-singleplayer="1">
<main id="menu" class="page on"><div class="eyebrow">PLAYER VS AI · FULL SCREEN</div><h1>MAROCTO<br><em>RACING</em></h1><div class="sub">PC EDITION · v1.4.0</div><p id="menuhelp" class="sub"></p><button id="fullscreen" class="fullscreen">⛶</button><button id="start" disabled>СТАРТ</button><button id="onlineButton">ONLINE</button><button id="set">НАСТРОЙКИ</button><button id="exit">ВЫХОД</button><p id="error" hidden></p></main>
<section id="garage" class="overlay"><div class="topbar"><h2 id="gt">ГАРАЖ</h2><span id="chosen"></span></div><div class="playertabs"><button id="tab0">ИГРОК</button><button id="tab1">AI</button></div><div class="row airow"><label for="ailevel" id="ailabel">СЛОЖНОСТЬ AI</label><select id="ailevel"><option value="0">ROOKIE</option><option value="1" selected>RIVAL</option><option value="2">PRO</option><option value="3">ELITE</option></select></div><div class="garagebody"><div id="garage-preview"><canvas id="gl"></canvas><span class="previewlabel">CC0 3D MODEL · MW PHYSICS</span></div><div class="carwrap"><div id="carlist" class="cars"></div><p id="modelnote" class="sub"></p></div></div><div class="actions"><button id="back1">НАЗАД</button><button id="racebtn">НАЧАТЬ ГОНКУ</button></div></section>
<section id="settings" class="overlay"><div class="topbar"><h2 id="st">НАСТРОЙКИ</h2></div><div class="settingsbody"><div class="row"><label for="lang" id="lt">ЯЗЫК</label><select id="lang"><option value="ru">Русский</option><option value="en">English</option><option value="uz">O‘zbek</option></select></div><div class="row"><label for="laps" id="lapt">КРУГИ</label><select id="laps"><option>1</option><option selected>3</option><option>5</option></select></div><div class="row"><label id="inputlabel" for="inputmode">УПРАВЛЕНИЕ</label><select id="inputmode"><option value="auto" id="inputauto">Автоматически</option><option value="keyboard" id="inputkeyboard">Клавиатура</option><option value="touch" id="inputtouch">Сенсорные кнопки</option></select></div><p id="keyboardhelp"></p></div><div class="actions"><button id="back2">НАЗАД</button></div></section>

<section id="onlineOverlay" class="overlay onlineoverlay"><div class="topbar"><h2 id="onlineTitle">ОНЛАЙН</h2><div class="onlinestate"><span id="onlineStatus">OFFLINE</span><span id="onlinePing"></span></div></div>
<div class="onlinebody">
  <div class="serverrow"><label id="onlineServerLabel" for="onlineServer">СЕРВЕР</label><input id="onlineServer" value="ws://127.0.0.1:8787/ws"><button id="onlineReconnect">ПЕРЕПОДКЛЮЧИТЬ</button></div>
  <p id="onlineError" class="onlineerror" hidden></p>
  <div id="onlineAuth" class="onlinepanel">
    <input id="onlineUser" maxlength="18" autocomplete="username" placeholder="НИК / USERNAME">
    <input id="onlinePassword" maxlength="72" type="password" autocomplete="current-password" placeholder="ПАРОЛЬ">
    <div class="onlinebuttons"><button id="onlineGuest">ЗАЙТИ КАК GUEST</button><button id="onlineRegister">РЕГИСТРАЦИЯ</button><button id="onlineLogin">ВОЙТИ</button></div>
  </div>
  <div id="onlineBrowser" class="onlinepanel" hidden>
    <div class="onlineprofile"><b id="onlineProfile"></b><button id="onlineLogout">ВЫЙТИ</button></div>
    <div class="creategrid">
      <input id="roomName" maxlength="32" placeholder="НАЗВАНИЕ КОМНАТЫ">
      <input id="roomPassword" maxlength="72" type="password" placeholder="ПАРОЛЬ КОМНАТЫ (НЕОБЯЗАТЕЛЬНО)">
      <label id="roomMaxLabel" for="roomMax">ИГРОКОВ</label><select id="roomMax"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>
      <label id="roomModeLabel" for="roomMode">РЕЖИМ</label><select id="roomMode"><option value="CIRCUIT">Circuit</option><option value="SPRINT">Sprint</option><option value="DRAG">Drag</option><option value="LAP_KNOCKOUT">Lap Knockout</option><option value="SPEEDTRAP">Speedtrap</option><option value="TOLLBOOTH">Tollbooth</option><option disabled>Free Roam — Coming Soon</option></select>
      <label id="roomLapsLabel" for="roomLaps">КРУГИ</label><select id="roomLaps"><option>1</option><option selected>3</option><option>5</option><option>7</option><option>10</option></select>
      <button id="onlineCreate">СОЗДАТЬ КОМНАТУ</button>
    </div>
    <h3 id="onlineFindTitle">FIND ROOM</h3><input id="roomSearch" placeholder="ПОИСК КОМНАТЫ"><div id="roomList" class="roomlist"></div>
  </div>
  <div id="onlineLobby" class="onlinepanel" hidden>
    <div class="lobbyhead"><div><h3 id="lobbyName"></h3><span id="lobbyMeta"></span></div></div>
    <div class="onlinecarbox">
      <div id="onlineCarPreview"><span class="previewlabel">YOUR CAR · LIVE PREVIEW</span></div>
      <div class="onlinecarcontrols"><label id="onlineCarLabel" for="onlineCar">МАШИНА</label><select id="onlineCar"></select><small id="onlineCarName"></small></div>
    </div>
    <div id="lobbyPlayers" class="lobbyplayers"></div>
    <p id="onlineRaceNotice" class="sub" hidden></p>
    <div class="onlinebuttons"><button id="onlineReady">ГОТОВ</button><button id="onlineStart">СТАРТ</button><button id="onlineLeave">ВЫЙТИ ИЗ КОМНАТЫ</button></div>
  </div>
</div><div class="actions"><button id="onlineBack">НАЗАД</button></div></section>
<section id="race" class="page"><div id="h0" class="hud h0">YOU</div><div id="h1" class="hud h1">AI</div><div id="status0" class="status s0"></div><div id="status1" class="status s1"></div><canvas id="minimap" width="150" height="110"></canvas><button id="quit" class="quit">МЕНЮ</button><div id="countdown"></div><div id="keys0" class="keylegend k0"></div>
<div class="ctrl c0"><button class="b l" data-p="0" data-k="l">‹</button><button class="b r" data-p="0" data-k="r">›</button><button class="b br" data-p="0" data-k="b">▼</button><button class="b g" data-p="0" data-k="g">▲</button><button class="b n" data-p="0" data-k="n">N₂O</button><button class="b d" data-p="0" data-k="d">DRIFT</button><button class="b reset" data-p="0" data-k="reset">↺</button></div>
<div id="finish" class="finish"><div><b id="win"></b><div class="resultactions"><button id="rematch">РЕВАНШ</button><button id="finishmenu">МЕНЮ</button></div></div></div><div id="pause" class="finish"><div><b id="pausetitle">ПАУЗА</b><div class="resultactions"><button id="resume">ПРОДОЛЖИТЬ</button><button id="pausemenu">МЕНЮ</button></div></div></div>
</section><script type="module" src="game.js"></script>
</body></html>
