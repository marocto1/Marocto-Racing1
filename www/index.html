<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Marocto Racing 3D</title><style>*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:system-ui}.page{position:fixed;inset:0;display:none}.page.on{display:flex}#menu{align-items:center;justify-content:center;flex-direction:column;gap:12px;background:radial-gradient(circle at 50% 25%,#1a2d4a,#05070b 68%)}h1{font-size:min(10vw,80px);margin:0}button,select{color:#fff;background:#141b29;border:1px solid #53617a;border-radius:13px;padding:12px 18px;font:700 16px system-ui}#menu>button{width:min(70vw,360px)}#garage,#settings{position:absolute;inset:8%;background:#0b101bdd;border:1px solid #39445b;border-radius:20px;padding:18px;display:none;overflow:auto;z-index:20}.cars{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sel{outline:2px solid white}.row{display:flex;justify-content:space-between;gap:10px;margin:12px 0}.sub{opacity:.65}#race{display:none;background:#000}#race.on{display:block}#gl{position:absolute;inset:0;width:100%;height:100%}.split{position:absolute;left:0;right:0;top:50%;height:2px;background:#fff8}.hud{position:absolute;left:10px;font-weight:900;text-shadow:0 2px 5px #000}.h0{top:8px}.h1{top:calc(50% + 8px)}.ctrl{position:absolute;left:0;right:0;height:50%;pointer-events:none}.c0{top:0}.c1{bottom:0}.b{position:absolute;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#0b1220aa;border:2px solid #ffffff66;font-size:24px;pointer-events:auto}.l{left:15px;bottom:15px}.r{left:88px;bottom:15px}.g{right:15px;bottom:15px}.br{right:88px;bottom:15px}.n{right:15px;bottom:88px;font-size:13px}.quit{position:absolute;right:8px;top:calc(50% - 20px);z-index:9;padding:8px}.finish{display:none;position:absolute;inset:0;background:#03050ad9;z-index:30;place-items:center;text-align:center}.finish.show{display:grid}.finish b{font-size:10vw}</style></head><body><main id=menu class="page on"><h1>MAROCTO RACING</h1><div class=sub id=tag>REAL WEBGL2 · SPLIT SCREEN</div><button onclick="openGarage()" id=start>СТАРТ</button><button onclick="openSettings()" id=set>НАСТРОЙКИ</button><button onclick="location.reload()" id=exit>ВЫХОД</button><small>3D v1.2</small><section id=garage><h2 id=gt>ГАРАЖ</h2><b>P1</b><div id=c0 class=cars></div><b>P2</b><div id=c1 class=cars></div><div class=row><button onclick="garage.style.display='none'" id=back1>НАЗАД</button><button onclick="go()" id=racebtn>ГОНКА</button></div></section><section id=settings><h2 id=st>НАСТРОЙКИ</h2><div class=row><span id=lt>ЯЗЫК</span><select id=lang onchange="language(this.value)"><option value=ru>Русский</option><option value=en>English</option><option value=uz>O‘zbek</option></select></div><div class=row><span id=lapt>КРУГИ</span><select id=laps><option>1</option><option selected>3</option><option>5</option></select></div><button onclick="settings.style.display='none'" id=back2>НАЗАД</button></section></main><section id=race class=page><canvas id=gl></canvas><div class=split></div><div id=h0 class="hud h0">P1</div><div id=h1 class="hud h1">P2</div><button class=quit onclick="MR.stop()">MENU</button><div class="ctrl c0"><i class="b l" data-p=0 data-k=l>‹</i><i class="b r" data-p=0 data-k=r>›</i><i class="b br" data-p=0 data-k=b>▼</i><i class="b g" data-p=0 data-k=g>▲</i><i class="b n" data-p=0 data-k=n>N₂O</i></div><div class="ctrl c1"><i class="b l" data-p=1 data-k=l>‹</i><i class="b r" data-p=1 data-k=r>›</i><i class="b br" data-p=1 data-k=b>▼</i><i class="b g" data-p=1 data-k=g>▲</i><i class="b n" data-p=1 data-k=n>N₂O</i></div><div id=finish class=finish><div><b id=win></b><br><button onclick="finish.classList.remove('show');go()">REMATCH</button><button onclick="finish.classList.remove('show');MR.stop()">MENU</button></div></div></section><script type=module src=game.js></script><script>const T={ru:['СТАРТ','НАСТРОЙКИ','ВЫХОД','ГАРАЖ','НАЗАД','ГОНКА','ЯЗЫК','КРУГИ'],en:['START','SETTINGS','EXIT','GARAGE','BACK','RACE','LANGUAGE','LAPS'],uz:['START','SOZLAMALAR','CHIQISH','GARAJ','ORTGA','POYGA','TIL','AYLANALAR']};function language(l){localStorage.lang=l;let t=T[l];start.textContent=t[0];set.textContent=t[1];exit.textContent=t[2];gt.textContent=t[3];back1.textContent=back2.textContent=t[4];racebtn.textContent=t[5];lt.textContent=t[6];lapt.textContent=t[7];lang.value=l}function openGarage(){garage.style.display='block';renderCars()}function openSettings(){settings.style.display='block'}function renderCars(){if(!window.MR)return setTimeout(renderCars,50);[0,1].forEach(p=>{let box=document.getElementById('c'+p);box.innerHTML='';MR.cars.forEach((c,i)=>{let b=document.createElement('button');b.textContent=c[0];if(MR.pick[p]===i)b.className='sel';b.onclick=()=>{MR.pick[p]=i;renderCars()};box.appendChild(b)})})}function go(){garage.style.display='none';MR.start(laps.value)}language(localStorage.lang||'ru');</script></body></html>
